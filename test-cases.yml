---
- summary: |
    Проверка успешного создания игровой комнаты в Лобби (Create Game)
  requirement: |
    Авторизованный пользователь должен иметь возможность создать новую игровую комнату, выбрав уровень сложности и тип игры.
  prerequisites: |
    Пользователь успешно авторизован в системе.
    Пользователь находится на главной странице Лобби.
  test-data: |
    Уровень сложности = Elementary
    Тип игры = With a bot
  steps:
    - Нажимаем на кнопку «Create Game»
    - Выбираем в выпадающем списке уровень сложности «Elementary»
    - Выбираем в выпадающем списке тип игры «With a bot»
    - Нажимаем кнопку «Create battle»
  expected-result: |
    Создается новая игровая комната. Пользователь автоматически перенаправляется на экран игрового поля (Game Arena), где ожидает подключения соперника.
    
- summary: |
    Проверка успешного прохождения тестов при отправке верного решения задачи
  requirement: |
    При нажатии зеленой кнопки "Run" написанный пользователем код должен запускаться на сервере, успешно проходить все тесты и фиксировать победу/завершение раунда.
  prerequisites: |
    Пользователь находится внутри игровой комнаты (Game Arena).
    Оппонент подключился, игра началась, таймер запущен.
  test-data: |
    Язык = Node.js 25.4.0
    Код решения = Валидный код, полностью удовлетворяющий условию задачи и проходящий все тест-кейсы 
  steps:
    - Пишем верное решение задачи в онлайн-редакторе кода
    - Нажимаем кнопку зеленую кнопку "Run"
  expected-result: |
    В окне вывода отображается статус «Yay! All tests passed!». Игра для данного пользователя завершается, его статус обновляется на «Game over» и фиксируется таймер оставшегося времени.

- summary: |
    Проверка работы чата внутри игровой комнаты
  requirement: |
    Игроки и зрители в комнате должны иметь возможность обмениваться текстовыми сообщениями в реальном времени.
  prerequisites: |
    Пользователь находится внутри игровой комнаты с соперником.
  test-data: |
    Текст сообщения = "Привет, друг!"
  steps:
    - Кликаем на поле ввода в блоке чата комнаты
    - Вводим текст сообщения
    - Нажимаем клавишу Enter или кнопку отправки Send
  expected-result: |
    Сообщение мгновенно появляется в окне чата с никнеймом текущего пользователя и корректным временем отправки. Соперник также видит это сообщение без перезагрузки страницы.

- summary: |
    Отправка решения задачи после истечения таймера матча
  requirement: |
    Система должна блокировать отправку кода и прохождение тестов, если официальное время раунда подошло к концу (таймер равен 00:00).
  prerequisites: |
    Пользователь находится внутри игровой комнаты (Game Arena).
    Осталось менее 10 секунд до завершения матча.
  test-data: |
    Таймер матча = 00:00 (время истекло)
    Код решения = Валидный и полностью рабочий код на языке Node.js 25.4.0
  steps:
    - Дождаться, пока таймер раунда дойдет до отметки 00:00 и игра официально завершится
    - Ввести рабочий код в поле редактора
    - Нажать кнопку зеленую кнопку "Run"
  expected-result: |
    Кнопка отправки заблокирована или при клике на нее система выдает предупреждение «Time is over! Match finished». Код на проверку не отправляется.
